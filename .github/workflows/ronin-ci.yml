name: Ronin Isolated Inference CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'refactor/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-inference-module:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ sqlite3 libsqlite3-dev ninja-build

      - name: Configure CMake
        run: |
          mkdir build_host && cd build_host
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..

      - name: KernelCompileTest
        run: |
          cd build_host
          ninja ronin_atomic_test ronin_integration_test ronin_governance_test ronin_self_healing_test ronin_evolution_test

      - name: KernelGovernanceTest
        run: |
          cd build_host
          ./ronin_governance_test

      - name: Self-Healing Runtime Tests
        run: |
          cd build_host
          ./ronin_self_healing_test

      - name: Behavioral Evolution Tests
        run: |
          cd build_host
          ./ronin_evolution_test

      - name: Run Inference Module Tests
        run: |
          cd build_host
          ./ronin_atomic_test
          ./ronin_integration_test

  build-android-jni:
    needs: validate-inference-module
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Android NDK r26b
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Host Flatc (v23)
        run: |
          git clone --branch v23.5.26 --depth 1 https://github.com/google/flatbuffers.git
          cd flatbuffers
          mkdir build && cd build
          cmake -G Ninja -DFLATBUFFERS_BUILD_TESTS=OFF -DFLATBUFFERS_BUILD_FLATC=ON ..
          ninja flatc
          sudo cp flatc /usr/local/bin/
          flatc --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android
          gradle-version: 8.9
          cache-disabled: true

      - name: Build Android JNI & APK (arm64-v8a)
        run: |
          cd android
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName=5.0.${{ github.run_number }}

      - name: Extract Native Library (.so)
        run: |
          mkdir -p output_libs
          find android/app/build/intermediates/cmake/debug -name "libronin_kernel.so" -exec cp {} output_libs/ \;
          cp android/app/build/outputs/apk/debug/app-debug.apk ronin-kernel-debug.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ronin-inference-artifacts
          path: |
            ronin-kernel-debug.apk
            output_libs/libronin_kernel.so
          retention-days: 7
