name: Ronin Kernel Build & Test

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y valgrind sqlite3 libsqlite3-dev
      - name: Build Host Tests
        run: |
          mkdir build_host && cd build_host
          cmake -DCMAKE_BUILD_TYPE=Debug ..
          make ronin_atomic_test ronin_integration_test
      - name: Run Host Tests
        run: |
          cd build_host
          ./ronin_atomic_test
          ./ronin_integration_test

  build-apk:
    needs: test-host
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Android NDK r26b
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Host Flatc (v23)
        run: |
          git clone --branch v23.5.26 --depth 1 https://github.com/google/flatbuffers.git
          cd flatbuffers
          mkdir build && cd build
          cmake -G Ninja -DFLATBUFFERS_BUILD_TESTS=OFF -DFLATBUFFERS_BUILD_FLATC=ON ..
          ninja flatc
          sudo cp flatc /usr/local/bin/
          echo "Host flatc v23.5.26 installed."

      - name: Deploy Assets
        run: |
          mkdir -p android/app/src/main/assets/models
          cp assets/capabilities.json android/app/src/main/assets/
          cp assets/providers.json android/app/src/main/assets/
          echo "Assets deployed to APK folder."

      - name: "Debug: List Assets"
        run: |
          echo "--- Assets ---"
          ls -R android/app/src/main/assets/ || echo "Assets directory missing"

      - name: Generate Dynamic CalVer
        run: |
          # Format: YY.MM.DD (e.g., 26.06.04)
          CALVER_RAW=$(date +'%y.%m.%d')
          echo "CALVER_STR=v${CALVER_RAW}" >> $GITHUB_ENV
          echo "CALVER_NUM=${CALVER_RAW}" >> $GITHUB_ENV

      - name: Build Android APK
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android
          gradle-version: 8.9
          cache-disabled: true
          arguments: |
            clean assembleDebug 
            -PversionCode=${{ github.run_number }} 
            -PversionName=${{ format('{0}.{1}', env.CALVER_NUM, github.run_number) }}

      - name: Rename APK
        run: |
          VERSION_NAME="${{ env.CALVER_NUM }}.${{ github.run_number }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "ronin-kernel-${VERSION_NAME}.apk"
          echo "VERSION_TAG=v${VERSION_NAME}" >> $GITHUB_ENV

      - name: Upload Ronin APK

        uses: actions/upload-artifact@v4
        with:
          name: ronin-kernel-app-debug
          path: "*.apk"
          retention-days: 5

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Ronin Kernel ${{ env.VERSION_TAG }}
          files: "*.apk"
          draft: false
          prerelease: true
          body: |
            ### 🧠 Ronin Kernel: ${{ env.VERSION_TAG }}
            Automatic hardened release with unified CalVer.
            
            **Changes in this version:**
            - Unified APK and Release versioning (${{ env.VERSION_TAG }}).
            - Sequential run number tracking.
            - Phased Agent Mode Framework (10-Layer Architecture).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
