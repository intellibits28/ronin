// android/app/build.gradle
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.ronin.kernel'
    compileSdk 34

    defaultConfig {
        applicationId "com.ronin.kernel"
        minSdk 26
        targetSdk 34
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1
        versionName project.hasProperty('versionName') ? project.property('versionName').toString() : "5.0.0-beta.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -frtti -fexceptions -O3"
                arguments "-DANDROID_STL=c++_shared"
                abiFilters "arm64-v8a"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        aidl true
    }

    packagingOptions {
        jniLibs {
            pickFirsts += [
                'lib/arm64-v8a/liblitert.so',
                'lib/arm64-v8a/liblitert_jni.so',
                'lib/arm64-v8a/libc++_shared.so'
            ]
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        doNotStrip "*/arm64-v8a/*.so"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-extended'
    
    // Hardware & Security
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // Network Stack
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // --- PHASE 11.0: Unified LiteRT-LM (Gemma 4 Production SDK) ---
    // Removed legacy MediaPipe GenAI and TFLite dependencies
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// --- Requirement 5: TERMUX & AARCH64 BUILD WORKAROUND (AIDL Issue) ---
// On Termux/aarch64, the Android SDK x86-64 'aidl' binary cannot execute natively.
// This workaround disables the native AidlCompile task and synthesizes the required
// IInferenceCallback.java interface stub directly into the build output folder.
if (System.getenv("TERMUX_VERSION") != null || project.hasProperty("disableAidl") || System.getProperty("os.arch") == "aarch64") {
    tasks.withType(com.android.build.gradle.tasks.AidlCompile.class).configureEach { aidlTask ->
        aidlTask.enabled = false
    }

    tasks.register("generateTermuxAidlStubs") {
        doLast {
            def outDirs = [
                file("${project.buildDir}/generated/aidl_source_output_dir/debug/out/com/ronin/kernel"),
                file("${project.buildDir}/generated/aidl_source_output_dir/release/out/com/ronin/kernel"),
                file("${project.buildDir}/generated/aidl_source_output_dir/debugAndroidTest/out/com/ronin/kernel")
            ]
            outDirs.each { dir ->
                dir.mkdirs()
                def stubFile = new File(dir, "IInferenceCallback.java")
                if (!stubFile.exists()) {
                    stubFile.text = """package com.ronin.kernel;
public interface IInferenceCallback extends android.os.IInterface {
    public static abstract class Stub extends android.os.Binder implements com.ronin.kernel.IInferenceCallback {
        public Stub() {
            this.attachInterface(this, "com.ronin.kernel.IInferenceCallback");
        }
        public static com.ronin.kernel.IInferenceCallback asInterface(android.os.IBinder obj) {
            if ((obj == null)) return null;
            android.os.IInterface iin = obj.queryLocalInterface("com.ronin.kernel.IInferenceCallback");
            if (((iin != null) && (iin instanceof com.ronin.kernel.IInferenceCallback))) {
                return ((com.ronin.kernel.IInferenceCallback)iin);
            }
            return null;
        }
        @Override public android.os.IBinder asBinder() { return this; }
        @Override public boolean onTransact(int code, android.os.Parcel data, android.os.Parcel reply, int flags) throws android.os.RemoteException {
            return super.onTransact(code, data, reply, flags);
        }
    }
    public void onToken(java.lang.String fragment, boolean isFinal) throws android.os.RemoteException;
    public void onError(java.lang.String message) throws android.os.RemoteException;
}
"""
                }
            }
        }
    }

    tasks.matching { it.name.startsWith("compile") && it.name.contains("Kotlin") }.configureEach {
        it.dependsOn("generateTermuxAidlStubs")
    }
    tasks.matching { it.name.startsWith("compile") && it.name.contains("Java") }.configureEach {
        it.dependsOn("generateTermuxAidlStubs")
    }
}

