// android/app/build.gradle
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.ronin.kernel'
    compileSdk 34

    defaultConfig {
        applicationId "com.ronin.kernel"
        minSdk 26
        targetSdk 34
        versionCode 25
        
        // CalVer Implementation: Debug-YYYY.MM.DD
        def date = new Date()
        versionName "Debug-" + date.format('yyyy.MM.dd')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
                abiFilters "arm64-v8a"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        aidl true
    }

    packagingOptions {
        jniLibs {
            pickFirsts += [
                'lib/arm64-v8a/libonnxruntime.so',
                'lib/arm64-v8a/libc++_shared.so'
            ]
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        doNotStrip "*/arm64-v8a/*.so"
    }
}

dependencies {
    // LiteRT LM Android SDK (Upgraded for Gemma 4 .litertlm support)
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.11.0'
    
    // Legacy MediaPipe GenAI (For .bin models)
    implementation 'com.google.mediapipe:tasks-genai:0.10.35'
    
    // Core Android & Compose
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.1'
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-extended'
    
    // Hardware & Security
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // AI Bridges (ML Kit Translate)
    implementation 'com.google.mlkit:translate:17.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
